name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: >-
          dotnet publish src/ArtCraftSuite/ArtCraftSuite.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/windows-x64
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/windows-x64/* -DestinationPath artifacts/ArtCraftSuite-windows-x64.zip
          (Get-FileHash artifacts/ArtCraftSuite-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  ArtCraftSuite-windows-x64.zip' | Set-Content artifacts/ArtCraftSuite-windows-x64.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: |
            artifacts/ArtCraftSuite-windows-x64.zip
            artifacts/ArtCraftSuite-windows-x64.zip.sha256

  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable action commit
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test and build Rust manager
        run: |
          cargo test --locked --manifest-path src/rust-macos/Cargo.toml
          cargo build --release --locked --manifest-path src/rust-macos/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --locked --manifest-path src/rust-macos/Cargo.toml --target x86_64-apple-darwin
      - name: Package Universal DMG
        run: bash scripts/package-rust-macos.sh src/rust-macos/target/aarch64-apple-darwin/release/artcraft-suite-macos src/rust-macos/target/x86_64-apple-darwin/release/artcraft-suite-macos artifacts/macos-universal "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-universal-release
          path: |
            artifacts/macos-universal/ArtCraftSuite-macos-universal.dmg
            artifacts/macos-universal/ArtCraftSuite-macos-universal.dmg.sha256

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable action commit
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libgl1-mesa-dri
      - name: Build and package
        run: |
          cargo build --release --locked --manifest-path src/rust-linux/Cargo.toml
          bash scripts/package-linux.sh src/rust-linux/target/release/artcraft-suite-linux artifacts/linux "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}-release
          path: |
            artifacts/linux/artcraft-suite_*.deb
            artifacts/linux/artcraft-suite_*.deb.sha256

  release:
    needs: [windows, macos-universal, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
