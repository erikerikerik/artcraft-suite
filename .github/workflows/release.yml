name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: >-
          dotnet publish src/ArtCraftSuite/ArtCraftSuite.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/windows-x64
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/windows-x64/* -DestinationPath artifacts/ArtCraftSuite-windows-x64.zip
          (Get-FileHash artifacts/ArtCraftSuite-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  ArtCraftSuite-windows-x64.zip' | Set-Content artifacts/ArtCraftSuite-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            artifacts/ArtCraftSuite-windows-x64.zip
            artifacts/ArtCraftSuite-windows-x64.zip.sha256

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build Rust manager
        run: |
          cargo test --locked --manifest-path src/rust-macos/Cargo.toml
          cargo build --release --locked --manifest-path src/rust-macos/Cargo.toml
      - name: Package Apple Silicon DMG
        run: bash scripts/package-rust-macos.sh src/rust-macos/target/release/artcraft-suite-macos artifacts/macos-arm64 "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: |
            artifacts/macos-arm64/ArtCraftSuite-macos-arm64.dmg
            artifacts/macos-arm64/ArtCraftSuite-macos-arm64.dmg.sha256

  release:
    needs: [windows, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
