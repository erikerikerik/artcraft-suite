name: CI

on:
  push:
    branches: [main, Apple-Universal-arm, linux]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/validate-manifest.mjs
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64
        run: >-
          dotnet publish src/ArtCraftSuite/ArtCraftSuite.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/windows-x64
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows-x64/* -DestinationPath artifacts/ArtCraftSuite-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArtCraftSuite-windows-x64
          path: artifacts/ArtCraftSuite-windows-x64.zip

  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable action commit
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test Rust manager
        run: cargo test --locked --manifest-path src/rust-macos/Cargo.toml
      - name: Build both manager architectures
        run: |
          cargo build --release --locked --manifest-path src/rust-macos/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --locked --manifest-path src/rust-macos/Cargo.toml --target x86_64-apple-darwin
      - name: Package Universal DMG
        run: bash scripts/package-rust-macos.sh src/rust-macos/target/aarch64-apple-darwin/release/artcraft-suite-macos src/rust-macos/target/x86_64-apple-darwin/release/artcraft-suite-macos artifacts/macos-universal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArtCraftSuite-macos-universal
          path: |
            artifacts/macos-universal/ArtCraftSuite-macos-universal.dmg
            artifacts/macos-universal/ArtCraftSuite-macos-universal.dmg.sha256

  linux:
    if: github.ref == 'refs/heads/linux' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable action commit
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev desktop-file-utils pkg-config jq xvfb \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libgl1-mesa-dri
      - name: Test Rust installer
        run: cargo test --locked --manifest-path src/rust-linux/Cargo.toml
      - name: Build Ubuntu manager
        run: cargo build --release --locked --manifest-path src/rust-linux/Cargo.toml
      - name: Smoke test window
        run: |
          set +e
          timeout 8s xvfb-run -a src/rust-linux/target/release/artcraft-suite-linux > /tmp/artcraft-window.log 2>&1
          result=$?
          set -e
          if [ "$result" -ne 124 ]; then cat /tmp/artcraft-window.log; exit 1; fi
      - name: Test a verified upstream AppImage
        run: |
          python3 scripts/fetch-smoke-appimage.py "${{ matrix.arch }}" /tmp/artcraft-smoke.AppImage
          ARTCRAFT_TEST_APPIMAGE=/tmp/artcraft-smoke.AppImage cargo test --locked --manifest-path src/rust-linux/Cargo.toml -- --ignored installs_real_upstream_appimage
      - name: Package and validate deb
        run: |
          version="$(sed -n 's/^version = \"\(.*\)\"/\1/p' src/rust-linux/Cargo.toml | head -1)"
          bash scripts/package-linux.sh src/rust-linux/target/release/artcraft-suite-linux artifacts/linux "$version"
          dpkg-deb --info artifacts/linux/artcraft-suite_${version}_${{ matrix.arch }}.deb
          dpkg-deb --contents artifacts/linux/artcraft-suite_${version}_${{ matrix.arch }}.deb
          cd artifacts/linux && sha256sum -c artcraft-suite_${version}_${{ matrix.arch }}.deb.sha256
      - name: Install deb and check desktop integration
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' src/rust-linux/Cargo.toml | head -1)"
          sudo apt-get install -y ./artifacts/linux/artcraft-suite_${version}_${{ matrix.arch }}.deb
          test -x /usr/bin/artcraft-suite
          desktop-file-validate /usr/share/applications/artcraft-suite.desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArtCraftSuite-ubuntu-${{ matrix.arch }}
          path: |
            artifacts/linux/artcraft-suite_*.deb
            artifacts/linux/artcraft-suite_*.deb.sha256
