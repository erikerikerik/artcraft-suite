name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - run: node scripts/validate-manifest.mjs
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-x64 | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ArtCraftSuite.exe artifacts/windows-x64/
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md artifacts/windows-x64/
          Compress-Archive -Path artifacts/windows-x64/* -DestinationPath artifacts/ArtCraftSuite-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArtCraftSuite-windows-x64
          path: artifacts/ArtCraftSuite-windows-x64.zip

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Build unsigned app preview
        run: |
          bash scripts/package-macos.sh target/aarch64-apple-darwin/release/ArtCraftSuite artifacts/macos-arm64/ArtCraftSuite.app
          ditto -c -k --sequesterRsrc --keepParent artifacts/macos-arm64/ArtCraftSuite.app artifacts/ArtCraftSuite-macos-arm64-unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArtCraftSuite-macos-arm64-unsigned
          path: artifacts/ArtCraftSuite-macos-arm64-unsigned.zip
