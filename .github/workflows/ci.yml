name: CI

on:
  push:
    branches: [main, Apple-Universal-arm]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/validate-manifest.mjs
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64
        run: >-
          dotnet publish src/ArtCraftSuite/ArtCraftSuite.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/windows-x64
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows-x64/* -DestinationPath artifacts/ArtCraftSuite-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArtCraftSuite-windows-x64
          path: artifacts/ArtCraftSuite-windows-x64.zip

  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable action commit
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test Rust manager
        run: cargo test --locked --manifest-path src/rust-macos/Cargo.toml
      - name: Build both manager architectures
        run: |
          cargo build --release --locked --manifest-path src/rust-macos/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --locked --manifest-path src/rust-macos/Cargo.toml --target x86_64-apple-darwin
      - name: Package Universal DMG
        run: bash scripts/package-rust-macos.sh src/rust-macos/target/aarch64-apple-darwin/release/artcraft-suite-macos src/rust-macos/target/x86_64-apple-darwin/release/artcraft-suite-macos artifacts/macos-universal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArtCraftSuite-macos-universal
          path: |
            artifacts/macos-universal/ArtCraftSuite-macos-universal.dmg
            artifacts/macos-universal/ArtCraftSuite-macos-universal.dmg.sha256
