[package]
name = "artcraft-suite"
version = "0.2.0"
edition = "2024"
description = "A lightweight installer and update manager for the ArtCraft creative applications"
license-file = "LICENSE"
repository = "https://github.com/erikerikerik/artcraft-suite"

[[bin]]
name = "ArtCraftSuite"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
open = "5.4.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = "thin"
strip = true
