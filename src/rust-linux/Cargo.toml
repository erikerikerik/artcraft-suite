[package]
name = "artcraft-suite-linux"
version = "0.1.1"
edition = "2024"
description = "Rust Ubuntu installer for the ArtCraft creative apps"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
semver = "1"

[profile.release]
strip = true
lto = "thin"
